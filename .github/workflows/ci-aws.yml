name: Employee Service CI + Docker + EKS Deploy

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      # Build employee-svc image
      - name: Build employee-svc Docker image
        run: docker build -t 366486935206.dkr.ecr.us-east-1.amazonaws.com/employee-svc:latest .

      # Build employee-db image
      - name: Build employee-db Docker image
        run: docker build -f Dockerfile.postgres -t 366486935206.dkr.ecr.us-east-1.amazonaws.com/employee-db:latest .

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Login to Amazon ECR
        run: |
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin 366486935206.dkr.ecr.us-east-1.amazonaws.com

      - name: Push employee-svc image
        run: docker push 366486935206.dkr.ecr.us-east-1.amazonaws.com/employee-svc:latest

      - name: Push employee-db image
        run: docker push 366486935206.dkr.ecr.us-east-1.amazonaws.com/employee-db:latest

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region us-east-1 --name employee-cluster

      - name: Deploy to EKS
        run: |
          kubectl apply -f k8s/secret.yaml
          kubectl apply -f k8s/configmap.yaml
          kubectl apply -f k8s/pvc.yaml
          kubectl apply -f k8s/postgres.yaml
          kubectl apply -f k8s/employee-svc.yaml
          kubectl apply -f k8s/ingress.yaml
