name: Employee Service CI + Docker

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build with Maven
        run: mvn -B package -DskipTests --file pom.xml

      #- name: Run tests
      #  run: mvn test --file pom.xml

      # Build employee-svc image
      - name: Build employee-svc Docker image
        run: docker build -t amityadavju09/employee-svc:latest .

      # Build postgres-custom image
      - name: Build postgres-custom image
        run: docker build -f postgres/Dockerfile.postgres -t amityadavju09/postgres-custom:15 .

      # Run containers with docker-compose (service + postgres)
      #- name: Start containers
      #  run: docker compose up --build -d

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push amityadavju09/employee-svc:latest

      - name: Push postgres-custom image
        run: docker push amityadavju09/postgres-custom:15